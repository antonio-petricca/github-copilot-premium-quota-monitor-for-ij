plugin_description=Displays your remaining Copilot Premium quota directly in the IDE status bar. Auto-refresh every 5 minutes or on demand. First-time setup: right-click the widget and select 'Sign in with GitHub' to authorize the plugin via the OAuth Device Flow. Requirements: IntelliJ IDEA 2025.2 or later; GitHub account with an active Copilot subscription.
