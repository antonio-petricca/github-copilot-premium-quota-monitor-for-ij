<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <!--
        GitHub Copilot icon — dark-theme variant
        Robot helmet / visor face, 2 px padding all around to avoid edge clipping
        Palette: #58A6FF (light-blue) on #0D1117 (GitHub dark)
    -->

    <!-- Dark background circle — stays 2 px away from all edges -->
    <circle cx="20" cy="20" r="18" fill="#0D1117"/>

    <!-- Light-blue face-plate: dome top, flat chin, rounded corners -->
    <path fill="#58A6FF"
          d="M20 9
             C14.2 9 9.5 13.4 9 18.9
             L9 29
             Q9 32 12 32
             L28 32
             Q31 32 31 29
             L31 18.9
             C30.5 13.4 25.8 9 20 9Z"/>

    <!-- Left "ear" pad -->
    <rect x="6" y="17" width="4" height="8" rx="2" fill="#58A6FF"/>
    <!-- Right "ear" pad -->
    <rect x="30" y="17" width="4" height="8" rx="2" fill="#58A6FF"/>

    <!-- Dark visor bar spanning the full face width -->
    <rect x="9" y="17" width="22" height="10" rx="5" fill="#0D1117"/>

    <!-- Left eye — light-blue sclera -->
    <circle cx="15" cy="22" r="3.2" fill="#58A6FF"/>
    <!-- Right eye — light-blue sclera -->
    <circle cx="25" cy="22" r="3.2" fill="#58A6FF"/>

    <!-- Left pupil -->
    <circle cx="15" cy="22" r="1.5" fill="#0D1117"/>
    <!-- Right pupil -->
    <circle cx="25" cy="22" r="1.5" fill="#0D1117"/>
</svg>

