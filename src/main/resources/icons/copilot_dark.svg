<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
    <!--
        GitHub Copilot icon — 16×16 (status bar) — dark-theme
        Scaled at 40% from the 40×40 pluginIcon_dark design
        Palette: #58A6FF on #0D1117
    -->

    <!-- Dark background circle -->
    <circle cx="8" cy="8" r="7" fill="#0D1117"/>

    <!-- Light-blue face-plate: dome top, flat chin -->
    <path fill="#58A6FF"
          d="M8 3.6
             C5.7 3.6 3.8 5.4 3.6 7.6
             L3.6 11.6
             Q3.6 12.8 4.8 12.8
             L11.2 12.8
             Q12.4 12.8 12.4 11.6
             L12.4 7.6
             C12.2 5.4 10.3 3.6 8 3.6Z"/>

    <!-- Left ear pad -->
    <rect x="2.4" y="6.8" width="1.6" height="3.2" rx="0.8" fill="#58A6FF"/>
    <!-- Right ear pad -->
    <rect x="12" y="6.8" width="1.6" height="3.2" rx="0.8" fill="#58A6FF"/>

    <!-- Dark visor bar -->
    <rect x="3.6" y="6.8" width="8.8" height="4" rx="2" fill="#0D1117"/>

    <!-- Left eye — light-blue sclera -->
    <circle cx="6" cy="8.8" r="1.3" fill="#58A6FF"/>
    <!-- Right eye — light-blue sclera -->
    <circle cx="10" cy="8.8" r="1.3" fill="#58A6FF"/>

    <!-- Left pupil -->
    <circle cx="6" cy="8.8" r="0.6" fill="#0D1117"/>
    <!-- Right pupil -->
    <circle cx="10" cy="8.8" r="0.6" fill="#0D1117"/>
</svg>

