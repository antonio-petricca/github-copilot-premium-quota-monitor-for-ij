# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Use Windows certificate store (needed in corporate environments with SSL inspection proxy)
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT

# --- Gradle plugin versions ---------------------------------------------------
kotlinVersion=2.1.20
intellijPlatformGradlePluginVersion=2.7.1

# --- Plugin identity ----------------------------------------------------------
pluginGroup=com.github.intellij.plugins.github_copilot_quota_monitor
pluginVersion=0.0.6
pluginName=GitHub Copilot - Premium Quota Monitor
pluginDescription=GitHub Copilot Premium Quota Monitor is an IntelliJ Platform plugin that helps you track your remaining GitHub Copilot premium model quota directly from the IDE status bar.\n\nKey features:\n- Real-time status bar widget showing remaining premium quota as a percentage, with color-coded urgency levels.\n- Tooltip with detailed quota information, including remaining requests and renewal date.\n- Manual and automatic background refresh of quota data.\n- Quick actions via widget popup: Refresh, Sign in, Sign out.\n- Secure OAuth Device Flow authentication, with tokens stored in PasswordSafe.\n- Visual feedback for loading, unlimited plans, unauthenticated and error states.\n- Full compatibility with all JetBrains IDEs (IntelliJ IDEA, PyCharm, WebStorm, GoLand, and more).\n- Localization support (English and Italian included).\n\nA GitHub account with an active Copilot subscription is required. The plugin is independent from the official GitHub Copilot plugin and works with all compatible JetBrains IDEs.\n\nEasy to use, secure, and designed to keep you informed about your Copilot premium usage at a glance.

# --- IntelliJ Platform --------------------------------------------------------
# IC = IntelliJ IDEA Community; change to IU for Ultimate
platformType=IC
platformVersion=2025.2.4
pluginSinceBuild=252

# --- Java / Kotlin compiler target --------------------------------------------
javaVersion=21

# --- Change notes (shown in the plugin manager) -------------------------------
pluginChangeNotes=Initial version.
